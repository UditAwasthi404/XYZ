<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ShelfSense · Live Shelf Audit</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<header>
  <div class="brand"><span class="logo">▣</span> ShelfSense <small>Real-time shelf auditing</small></div>
  <div class="live"><span id="dot" class="dot"></span><span id="liveText">connecting…</span></div>
</header>

<main>
  <section class="cards">
    <div class="card"><label>On-shelf availability</label><b id="m-osa">–</b></div>
    <div class="card"><label>Planogram compliance</label><b id="m-comp">–</b></div>
    <div class="card"><label>Mean time to resolve</label><b id="m-mttr">–</b></div>
    <div class="card"><label>Open tasks</label><b id="m-open">–</b><span id="m-res" class="sub"></span></div>
  </section>

  <section class="grid">
    <div class="panel">
      <div class="panel-head">
        <h2>Audit a shelf</h2>
        <form id="form">
          <select id="shelf"></select>
          <input id="file" type="file" accept="image/*" />
          <button type="submit">Run audit</button>
        </form>
      </div>
      <div class="samples"><span>Demo images:</span><span id="samples"></span></div>
      <div id="viewer" class="viewer"><p class="empty">Upload a shelf photo or click a demo image.</p></div>
      <div id="summary" class="summary"></div>
      <div class="legend"><i class="g"></i>product <i class="r"></i>gap / out of stock <i class="o"></i>misplaced / low stock</div>
    </div>

    <div class="panel alerts">
      <div class="panel-head"><h2>Live tasks</h2>
        <div class="tabs"><button data-s="open" class="on">Open</button><button data-s="resolved">Resolved</button></div>
      </div>
      <ul id="alerts"></ul>
    </div>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
